# 쇼츠 렌더 — NAS 큐의 대본을 받아 TTS·Remotion 렌더·검사·유튜브 공개 업로드 후 결과를 NAS 로 돌려준다.
# (2026-10-02 PC 예약 작업에서 이전. 코드: worker/, NAS 쪽 문: api/routers/worker.py)
#
# 시각: NAS 가 상품 쇼츠를 큐에 넣는 시각(KST 8·11·14·17·20·23시 50분) 직후 — KST 9·12·15·18·21·0시.
#       블로그 쇼츠(10·16·22시 20분)는 다음 회차에 함께 처리된다. GitHub 예약은 수~수십 분 늦을 수 있다.
# 비용: 대기 작업이 없으면 첫 단계(수 초)에서 끝난다. 렌더 한 편은 설치 포함 약 5~8분.
#
# 필요한 Secrets: WORKER_TOKEN, YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN
# 선택(Veo 훅 장면): GCP_SA_KEY 또는 VERTEX_API_KEY(Vertex AI), GEMINI_API_KEY(Gemini API)

name: shorts-render

on:
  schedule:
    # 예비(NAS 가 큐에 넣을 때 workflow_dispatch 로 바로 부른다 — 예약 실행은 정시 몰림으로 몇 시간씩 늦었다)
    - cron: "17 0,3,6,9,12,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "업로드 없이 렌더·검사만(작업은 큐로 되돌림)"
        type: boolean
        default: false
      max_jobs:
        description: "이번 실행에서 처리할 최대 편수"
        default: "3"

concurrency:
  group: shorts-render
  cancel-in-progress: false

permissions:
  contents: read

env:
  WORKER_API: https://track.dsportal.io/api/worker

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.p.outputs.pending }}
    steps:
      - id: p
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: |
          n=$(curl -fsS --retry 3 -H "Authorization: Bearer $WORKER_TOKEN" "$WORKER_API/pending" | python3 -c 'import sys,json; print(json.load(sys.stdin)["pending"])')
          echo "대기 작업 $n 건"
          echo "pending=$n" >> "$GITHUB_OUTPUT"

  render:
    needs: check
    if: needs.check.outputs.pending != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: worker

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/remotion_shorts/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: 시스템 패키지(ffmpeg·크롬 의존성)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libxrandr2 \
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libcups2 libasound2t64 >/dev/null

      - name: 의존성
        run: |
          pip install -q -r requirements.txt
          cd remotion_shorts && npm ci --no-audit --no-fund && npx remotion browser ensure

      - name: 유튜브 자격
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          mkdir -p youtube_shorts/credentials
          python3 - <<'EOF'
          import json, os
          json.dump({"client_id": os.environ["YT_CLIENT_ID"], "client_secret": os.environ["YT_CLIENT_SECRET"],
                     "refresh_token": os.environ["YT_REFRESH_TOKEN"], "token_uri": "https://oauth2.googleapis.com/token",
                     "scopes": ["https://www.googleapis.com/auth/youtube", "https://www.googleapis.com/auth/youtube.force-ssl",
                                "https://www.googleapis.com/auth/youtube.upload"]},
                    open("youtube_shorts/credentials/youtube_oauth.json", "w"))
          EOF

      - name: 렌더·업로드
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          MAX_JOBS: ${{ inputs.max_jobs || '3' }}
          REMOTION_CONCURRENCY: "100%"
          # 상품 쇼츠 훅의 '불편한 상황' 장면(Veo). 시크릿이 없으면 사진만으로 만든다(youtube_shorts/veo.py).
          # 제미나이 프로젝트(gen-lang-client-0948415395)의 Vertex AI 를 제미나이 키로 부르고, 안 되면 Gemini API.
          # dsportal-491115 는 Veo 에 쓰지 않는다(2026-10-19 Somi — 결제가 꺼져 있어 403).
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          VERTEX_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_API_KEY_PROJECT: ${{ vars.VERTEX_API_KEY_PROJECT }}
          VERTEX_PROJECT: ${{ vars.VERTEX_API_KEY_PROJECT || 'gen-lang-client-0948415395' }}
          VEO_VERTEX_MODEL: ${{ vars.VEO_VERTEX_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VEO_MODEL: ${{ vars.VEO_MODEL }}
        run: python youtube_shorts/cloud_worker.py

      - name: 장면 모음 보관(확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheets
          path: worker/remotion_shorts/out/*_sheet.jpg
          retention-days: 7
          if-no-files-found: ignore
