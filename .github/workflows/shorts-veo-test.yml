# 상품 쇼츠 Veo 훅 장면 테스트 — 고정 샘플 대본으로 렌더만 하고 mp4 를 아티팩트로 남긴다(업로드·NAS 큐 없음).
# Actions → shorts-veo-test → Run workflow 로 아무 때나 돌린다. 작업 브랜치에서 veo.py·샘플을 바꿔 올려도 돈다.
name: shorts-veo-test

on:
  push:
    branches-ignore: [main]
    paths: [.github/workflows/shorts-veo-test.yml, worker/youtube_shorts/samples/**, worker/youtube_shorts/veo.py,
            worker/youtube_shorts/make_explainer_short.py, worker/remotion_shorts/src/explainer/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: worker
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/remotion_shorts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: 시스템 패키지
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libxrandr2 \
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libcups2 libasound2t64 >/dev/null
      - name: 의존성
        run: |
          pip install -q -r requirements.txt
          cd remotion_shorts && npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: 렌더(업로드 없음)
        env:
          REMOTION_CONCURRENCY: "100%"
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          VERTEX_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_API_KEY_PROJECT: ${{ vars.VERTEX_API_KEY_PROJECT }}
          VERTEX_PROJECT: ${{ vars.VERTEX_API_KEY_PROJECT || 'gen-lang-client-0948415395' }}
          VEO_VERTEX_MODEL: ${{ vars.VEO_VERTEX_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VEO_MODEL: ${{ vars.VEO_MODEL }}
        run: python youtube_shorts/make_explainer_short.py --post-json youtube_shorts/samples/veo_test_product.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veo-test
          path: |
            worker/remotion_shorts/out/*.mp4
            worker/remotion_shorts/out/*_sheet.jpg
            worker/remotion_shorts/public/pr_9023/hook.mp4
          retention-days: 7
          if-no-files-found: ignore
