# 3시간 음악 영상(수면) 반자동 제작 — Lyria 생성·자동 검사·조립·1080p 렌더, 원하면 유튜브 **비공개** 업로드.
# 공개 전환은 스튜디오에서 사람이 검수한 뒤 직접 한다. 코드: worker/longform_music/ (사용법은 run.py 맨 위)
#
# 과금: Lyria 3 Pro 곡당 $0.08(Vertex AI 가격표, 2026-10-10). 3시간 ≈ 60~75곡 ≈ $5~6. max_cost 를 넘기 전에 멈춘다.
# 같은 job 이름으로 다시 돌리면 캐시에서 이미 만든 곡을 불러와 모자란 만큼만 새로 만든다(재과금 없음).
# 사람이 뺄 곡이 있으면 reject 에 곡 id(t004,t017)를 넣고 다시 돌린다.
# 시험은 hours=0.17(약 10분), max_cost=0.6 정도로 — 곡 4~5개만 만든다.
#
# 시작 방법 두 가지: ① Actions → Run workflow ② longform-run 브랜치에 worker/longform_music/run-request.json
# ({"job","hours","max_cost","reject","upload", 선택 "category", "redo_visuals", "reupload", "from", "only"})
# category: sleep(기본)·sleep-rain·sleep-ocean·sleep-forest·sleep-space — 테마마다 배경 소리·장면·제목·재생목록이 다르다.
# "only": "seo" 는 검색·해외 노출 점검 보고(채널·영상 공개 상태·번역), "apply": true 면 번역 없는 영상에 10개 언어 제목·설명을 넣는다.
# "only": "playlist" 는 이미 올린 영상을 재생목록에만 넣는다(제작·업로드 없음).을 바꿔 푸시 — Claude 처럼 Actions 실행 권한 없이 푸시만 되는 쪽용.
#
# 긴 영상(모음): "from": "sleep-001,sleep-002"(최대 4개) 를 주면 그 작업들의 승인 곡을 모아 새 작업을 만든다 — Lyria 비용 0.
# 곡이 목표 길이를 다 채울 때만 만든다(같은 곡 반복 없음). "hours": 0 이면 채울 수 있는 만큼(시간 단위 내림).
# 자동 모음: 짝수 번째 작업(rain-002, rain-004…)을 올리면 바로 앞 작업과 묶어 rain-6h-001, rain-6h-002… 를 만들어 올린다.
#
# 필요한 것: secrets.GEMINI_API_KEY(없으면 VERTEX_API_KEY; Gemini API 프로젝트 키, vars.VERTEX_API_KEY_PROJECT) — Lyria·이미지 모두 이 키로,
#           업로드 때만 YT_CLIENT_ID / YT_CLIENT_SECRET(쇼츠와 같은 OAuth 앱) + SLEEP_YT_REFRESH_TOKEN(Moonlit Hush 채널 토큰).

name: longform-music

on:
  workflow_dispatch:
    inputs:
      job:
        description: "작업 이름(같은 이름이면 이어서). 예: sleep-001"
        required: true
      hours:
        description: "영상 길이(시간)"
        default: "3"
      max_cost:
        description: "이 작업의 Lyria 누적 비용 한도(달러)"
        default: "8"
      reject:
        description: "검수에서 뺄 곡 id(쉼표, 선택)"
        default: ""
      upload:
        description: "끝나면 유튜브에 비공개로 올리기"
        type: boolean
        default: false
  push:
    branches: [longform-run]
    paths: [worker/longform_music/run-request.json]
  # 정기 제작(Somi 2026-10-15 '주 2편'): 월·목 17:00 UTC(화·금 02:00 KST). 한 주에 한 테마 두 편, 두 번째 편 뒤에
  # 6시간 모음이 자동으로 붙는다(run.py next_job). 테마별 마지막 번호는 캐시 longform-state-* 에 둔다.
  schedule:
    - cron: "0 17 * * 1,4"

concurrency:
  group: longform-music
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"            # 진행 로그가 바로 보이게(러너가 중간에 끊겨도 어디까지 했는지 남는다)
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: worker
      - name: 테마별 번호 불러오기
        uses: actions/cache/restore@v4
        with:
          path: worker/longform_music/state
          key: longform-state-${{ github.run_id }}
          restore-keys: longform-state-
      - name: 설정(실행 입력 또는 run-request.json)
        env:
          IN_JOB: ${{ inputs.job }}
          IN_HOURS: ${{ inputs.hours }}
          IN_COST: ${{ inputs.max_cost }}
          IN_REJECT: ${{ inputs.reject }}
          IN_UPLOAD: ${{ inputs.upload }}
        run: |
          python3 - <<'PY'
          import json, os, re
          if os.environ["GITHUB_EVENT_NAME"] == "schedule":
              import datetime, sys
              sys.path.insert(0, "longform_music")
              from cadence import load_state, next_job
              now = datetime.datetime.now(datetime.timezone.utc)
              r = next_job(load_state(), now.isocalendar()[1], now.weekday())
              assert r, "정기 제작 요일(월·목)이 아니다"
              print("정기 제작:", r)
          elif os.environ["GITHUB_EVENT_NAME"] == "push":
              r = json.load(open("longform_music/run-request.json"))
          else:
              r = {"job": os.environ["IN_JOB"], "hours": os.environ["IN_HOURS"], "max_cost": os.environ["IN_COST"],
                   "reject": os.environ["IN_REJECT"], "upload": os.environ["IN_UPLOAD"] == "true"}
          job = str(r["job"])
          assert re.fullmatch(r"[A-Za-z0-9_-]{1,40}", job), "job 이름은 영문·숫자·-·_ 만"
          assert re.fullmatch(r"[0-9A-Za-z,]*", str(r.get("reject", ""))), "reject 형식"
          src = [x.strip() for x in str(r.get("from", "")).split(",") if x.strip()]
          assert len(src) <= 4 and all(re.fullmatch(r"[A-Za-z0-9_-]{1,40}", x) and x != job for x in src), "from 형식"
          cat = str(r.get("category", "sleep"))
          assert re.fullmatch(r"[a-z-]{1,30}", cat), "category 형식"
          only = str(r.get("only", ""))
          assert only in ("", "playlist", "seo"), "only 는 playlist·seo 만"
          vals = {"JOB": job, "CATEGORY": cat, "ONLY": only, "FROM": ",".join(src), **{f"FROM{i + 1}": x for i, x in enumerate(src)}, "OUT": f"longform_music/out/{job}", "HOURS": float(r.get("hours", 3)),
                  "MAX_COST": float(r.get("max_cost", 8)), "REJECT": r.get("reject", ""),
                  "UPLOAD": "1" if r.get("upload") in (True, "true", "1", 1) else "",
                  "REDO_VISUALS": "1" if r.get("redo_visuals") in (True, "true", "1", 1) else "",
                  "REUPLOAD": "1" if r.get("reupload") in (True, "true", "1", 1) else "",
                  "APPLY": "1" if r.get("apply") in (True, "true", "1", 1) else ""}
          # 테마별 영상이 2편 모이면(짝수 번째 작업을 올린 뒤) 앞 작업과 묶어 6시간 모음을 자동으로 만든다(Lyria 비용 0)
          mt = re.fullmatch(r"(.+)-(\d{3})", job)
          if (mt and not mt[1].endswith("-6h") and int(mt[2]) % 2 == 0 and not src and not only
                  and vals["UPLOAD"] and not vals["REUPLOAD"]):
              vals["AUTO_PREV"] = f"{mt[1]}-{int(mt[2]) - 1:03d}"
              vals["AUTO_JOB"] = f"{mt[1]}-6h-{int(mt[2]) // 2:03d}"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in vals.items():
                  f.write(f"{k}={v}\n")
          print(vals)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: 시스템 패키지
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - name: 의존성
        run: pip install -q -r requirements.txt
      - name: 이전 곡 불러오기
        uses: actions/cache/restore@v4
        with:
          path: worker/longform_music/out/${{ env.JOB }}
          key: longform-${{ env.JOB }}-${{ github.run_id }}
          restore-keys: longform-${{ env.JOB }}-
      - name: 모을 작업 곡 불러오기 1
        if: env.FROM1 != ''
        uses: actions/cache/restore@v4
        with:
          path: worker/longform_music/out/${{ env.FROM1 }}
          key: longform-${{ env.FROM1 }}-none
          restore-keys: longform-${{ env.FROM1 }}-
      - name: 모을 작업 곡 불러오기 2
        if: env.FROM2 != ''
        uses: actions/cache/restore@v4
        with:
          path: worker/longform_music/out/${{ env.FROM2 }}
          key: longform-${{ env.FROM2 }}-none
          restore-keys: longform-${{ env.FROM2 }}-
      - name: 모을 작업 곡 불러오기 3
        if: env.FROM3 != ''
        uses: actions/cache/restore@v4
        with:
          path: worker/longform_music/out/${{ env.FROM3 }}
          key: longform-${{ env.FROM3 }}-none
          restore-keys: longform-${{ env.FROM3 }}-
      - name: 모을 작업 곡 불러오기 4
        if: env.FROM4 != ''
        uses: actions/cache/restore@v4
        with:
          path: worker/longform_music/out/${{ env.FROM4 }}
          key: longform-${{ env.FROM4 }}-none
          restore-keys: longform-${{ env.FROM4 }}-
      - name: 곡 모으기(compile)
        if: env.FROM != ''
        run: python longform_music/run.py compile --job "$JOB" --category "$CATEGORY" --from "$FROM" --hours "$HOURS"
      - name: 유튜브 자격증명
        if: env.UPLOAD == '1' || env.ONLY == 'playlist' || env.ONLY == 'seo'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # 수면 채널(Moonlit Hush, @moonlit-hushsleep) 전용 토큰. 쇼핑 쇼츠 채널 토큰(YT_REFRESH_TOKEN)으로는 올리지 않는다.
          YT_REFRESH_TOKEN: ${{ secrets.SLEEP_YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::error::SLEEP_YT_REFRESH_TOKEN 시크릿이 없다 — Moonlit Hush 채널로 토큰을 받아 넣은 뒤 다시 실행"; exit 1
          fi
          mkdir -p youtube_shorts/credentials
          python3 - <<'PY'
          import json, os
          json.dump({"client_id": os.environ["YT_CLIENT_ID"], "client_secret": os.environ["YT_CLIENT_SECRET"],
                     "refresh_token": os.environ["YT_REFRESH_TOKEN"], "token_uri": "https://oauth2.googleapis.com/token",
                     # get_channel_token.py 가 받은 권한과 똑같이 — 받지 않은 권한(force-ssl 등)을 넣으면 갱신이 invalid_scope
                     "scopes": ["https://www.googleapis.com/auth/youtube.upload", "https://www.googleapis.com/auth/youtube"]},
                    open("youtube_shorts/credentials/youtube_oauth.json", "w"))
          PY
      - name: 검수에서 뺀 곡 반영
        if: env.REJECT != ''
        run: python longform_music/run.py review --job "$JOB" --reject "$REJECT"
      - name: 배경·썸네일 다시 만들기(redo_visuals)
        if: env.REDO_VISUALS == '1'
        run: python longform_music/run.py visuals --job "$JOB"
      - name: 다시 올리기(reupload)
        if: env.REUPLOAD == '1'
        run: python longform_music/run.py reupload --job "$JOB"
      - name: 재생목록에만 넣기(only=playlist)
        if: env.ONLY == 'playlist'
        run: python longform_music/run.py playlist --job "$JOB"
      - name: 검색·해외 노출 점검(only=seo, apply 면 번역 넣기)
        if: env.ONLY == 'seo'
        env:
          VERTEX_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VERTEX_API_KEY }}
          VERTEX_API_KEY_PROJECT: ${{ vars.VERTEX_API_KEY_PROJECT }}
          VERTEX_PROJECT: ${{ vars.VERTEX_API_KEY_PROJECT }}
        run: |
          python longform_music/run.py seo --job seo ${APPLY:+--apply}
          cat longform_music/out/seo-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 제작
        if: env.ONLY == ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          VERTEX_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VERTEX_API_KEY }}
          VERTEX_API_KEY_PROJECT: ${{ vars.VERTEX_API_KEY_PROJECT }}
          # 수면 음악은 Gemini API 프로젝트(키를 만든 프로젝트)만 쓴다 — dsportal 프로젝트는 결제가 꺼져 있다(2026-10-10)
          # 키는 쇼츠 Veo 와 같은 GEMINI_API_KEY(#1). 이 저장소의 VERTEX_API_KEY 로는 Lyria 가 401(API keys are not supported)
          # 로 막혀 10/19 정기 제작(forest-003)이 곡 하나 못 만들고 멈췄다.
          VERTEX_PROJECT: ${{ vars.VERTEX_API_KEY_PROJECT }}
          LYRIA_MODEL: ${{ vars.LYRIA_MODEL }}
        run: |
          python longform_music/run.py all --job "$JOB" --category "$CATEGORY" --hours "$HOURS" --max-cost "$MAX_COST" \
            ${UPLOAD:+--upload}
      - name: 테마별 번호 남기기
        if: success() && env.ONLY == '' && env.FROM == '' && env.UPLOAD == '1'
        run: python longform_music/run.py mark --job "$JOB"
      - name: 테마별 번호 저장
        if: success() && env.ONLY == '' && env.FROM == '' && env.UPLOAD == '1'
        uses: actions/cache/save@v4
        with:
          path: worker/longform_music/state
          key: longform-state-${{ github.run_id }}
      - name: 미리 듣기(앞 15분 mp3)·보고서
        if: always()
        run: |
          [ -f "$OUT/audio.m4a" ] && ffmpeg -y -v error -t 900 -i "$OUT/audio.m4a" -b:a 128k "$OUT/preview_15min.mp3" || true
          [ -f "$OUT/report.md" ] && cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longform-${{ env.JOB }}
          path: |
            worker/${{ env.OUT }}/report.md
            worker/${{ env.OUT }}/manifest.json
            worker/${{ env.OUT }}/thumbnail.jpg
            worker/${{ env.OUT }}/preview_15min.mp3
          retention-days: 14
          if-no-files-found: ignore
      - name: 큰 파일 정리(캐시에는 곡과 기록만)
        if: always()
        run: rm -rf "$OUT/final.mp4" "$OUT/audio.m4a" "$OUT/norm" "$OUT/preview_15min.mp3"
      - name: 곡 저장(다음 실행에서 이어서)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: worker/longform_music/out/${{ env.JOB }}
          key: longform-${{ env.JOB }}-${{ github.run_id }}
      - name: 테마 모음 — 앞 작업 곡 불러오기
        if: success() && env.AUTO_JOB != ''
        uses: actions/cache/restore@v4
        with:
          path: worker/longform_music/out/${{ env.AUTO_PREV }}
          key: longform-${{ env.AUTO_PREV }}-none
          restore-keys: longform-${{ env.AUTO_PREV }}-
      - name: 테마 모음 — 이전 모음 작업 불러오기
        if: success() && env.AUTO_JOB != ''
        uses: actions/cache/restore@v4
        with:
          path: worker/longform_music/out/${{ env.AUTO_JOB }}
          key: longform-${{ env.AUTO_JOB }}-${{ github.run_id }}
          restore-keys: longform-${{ env.AUTO_JOB }}-
      - name: 테마 모음 — 6시간 영상 만들어 비공개 업로드
        if: success() && env.AUTO_JOB != ''
        env:
          VERTEX_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VERTEX_API_KEY }}
          VERTEX_API_KEY_PROJECT: ${{ vars.VERTEX_API_KEY_PROJECT }}
          VERTEX_PROJECT: ${{ vars.VERTEX_API_KEY_PROJECT }}
        run: |
          python longform_music/run.py autocompile --job "$JOB" --category "$CATEGORY" --upload
          A="longform_music/out/$AUTO_JOB"
          [ -f "$A/report.md" ] && cat "$A/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: 테마 모음 — 저장
        if: always() && env.AUTO_JOB != ''
        run: |
          A="longform_music/out/$AUTO_JOB"
          rm -rf "$A/final.mp4" "$A/audio.m4a" "$A/norm"
          [ -f "$A/manifest.json" ] && echo "AUTO_SAVE=1" >> "$GITHUB_ENV" || true
      - name: 테마 모음 — 곡 저장
        if: always() && env.AUTO_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: worker/longform_music/out/${{ env.AUTO_JOB }}
          key: longform-${{ env.AUTO_JOB }}-${{ github.run_id }}
